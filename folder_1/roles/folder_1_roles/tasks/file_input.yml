---
- name: Store some data
  ansible.builtin.shell:
    cmd: echo "Hello world" >> {{ name }}.txt
  register: file_out
  changed_when: false

- name: LLO
  ansible.builtin.debug:
    var: file_out

- name: outtt
  ansible.builtin.command:
    cmd: ls -l
  register: list

- name: LLO
  ansible.builtin.debug:
    var: list

- name: result
  ansible.builtin.command:
    cmd: cat {{ name }}.txt
  register: output
  changed_when: false
  when: file_out.rc == 0

- name: disply
  ansible.builtin.debug:
    var: output
  when: output.rc == 0
  

