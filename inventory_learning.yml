---
- name: Inventory Hands-On Lab 2
  hosts: all
  gather_facts: false

  tasks:
    - name: Show vars
      ansible.builtin.debug:
        msg: "{{hostvars['aci01']}}"
        
    - name: Show current inventory hostname
      ansible.builtin.debug:
        msg: "Current host = {{ inventory_hostname }}"

    - name: Show ansible host
      ansible.builtin.debug:
        msg: "ansible_host = {{ ansible_host | default('Not defined') }}"

    - name: Show groups for current host
      ansible.builtin.debug:
        msg: "group_names = {{ group_names }}"

    - name: Show OS type
      ansible.builtin.debug:
        msg: "os_type = {{ os_type | default('Not defined') }}"

    - name: Show all inventory hosts
      ansible.builtin.debug:
        msg: "All hosts = {{ groups['all'] }}"

    - name: Show only ACI hosts
      ansible.builtin.debug:
        msg: "ACI hosts = {{ groups['aci'] }}"

    - name: Show all locations
      ansible.builtin.debug:
        msg: "All hosts locations = {{ location }}"
